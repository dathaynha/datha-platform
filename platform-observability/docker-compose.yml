name: platform-observability

services:
  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: obs-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: "dark"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus

  loki:
    image: grafana/loki:3.7.4
    container_name: obs-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: obs-prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=14d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: obs-alloy
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "12345:12345" # Alloy UI
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - loki
      - prometheus

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: obs-postgres-exporter
    environment:
      # Real DSN lives in ./.env (gitignored) — see .env.example
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN}
    ports:
      - "9187:9187"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis-exporter:
    image: oliver006/redis_exporter:v1.88.0
    container_name: obs-redis-exporter
    environment:
      REDIS_ADDR: redis://host.docker.internal:6379
    ports:
      - "9121:9121"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.20.1
    container_name: obs-nats-exporter
    command:
      - -varz
      - -connz
      - -jsz=all
      - http://host.docker.internal:8222
    ports:
      - "7777:7777"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  grafana-data:
  loki-data:
  prometheus-data:
