<div class="shell-root flex min-h-[100dvh] flex-col">
  <p-toolbar class="shell-toolbar datha-glass-bar">
    <ng-template pTemplate="start"></ng-template>
    <ng-template pTemplate="end">
      <div class="flex flex-wrap items-center gap-3">
        <datha-theme-select
          inputId="login-theme"
          [selected]="selectedTheme"
          (selectedChange)="onThemeChange($event)"
        />
        <datha-lang-select
          inputId="login-lang"
          [languages]="languages"
          [selected]="selectedLanguage"
          (selectedChange)="onLanguageChange($event)"
        />
      </div>
    </ng-template>
  </p-toolbar>
  <main class="flex min-h-0 flex-1 flex-col">
    <router-outlet />
  </main>
</div>
