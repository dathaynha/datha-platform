# Bot Review — messenger-frontend
#
# The job body lives in the shared template repo so a fix lands once instead of
# nine times: platform-pipelines/templates/stack-angular-karma.yml. This file keeps the triggers
# and the parameters, and stays at this path so the pipeline definition
# (referenced by main's build-validation policy) is unchanged.
#
# Pinned to a tag on purpose — never track the template repo's main, or one edit
# there changes every pipeline at once with no review.
trigger: none

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

variables:
  # Key Vault-linked group (dathq-platform-kv via azure-dathq-platform connection)
  - group: platform-bot-review

resources:
  repositories:
    - repository: templates
      type: git
      name: DatHa Platform/platform-pipelines
      ref: refs/tags/v9

extends:
  template: templates/stack-angular-karma.yml@templates
  parameters:
    service: messenger-frontend
    # The shared template defaults to `--browsers=ChromeHeadless`, an 800x600
    # window. The call dock's presenting layout only exists above `min-width:
    # 60rem`, so the specs that measure it need a wider viewport — and with the
    # default they failed in CI while passing locally, which is worse than not
    # having them. `ChromeHeadlessWide` is defined in karma.conf.js.
    testCommand: 'pnpm exec ng test --no-watch --browsers=ChromeHeadlessWide --no-progress'
