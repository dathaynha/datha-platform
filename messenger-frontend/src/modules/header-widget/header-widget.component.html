<!-- Trigger styling mirrors the shell's bell and profile triggers exactly
     (rounded + outlined + datha-profile-trigger); the relative wrapper is the
     bell's badge anchor, reused here for the unread badge in phase 1. -->
<div class="relative" #messengerTrigger>
  <p-button
    type="button"
    icon="pi pi-comments"
    [rounded]="true"
    [outlined]="true"
    styleClass="datha-profile-trigger"
    [ariaLabel]="'MESSENGER.WIDGET.ARIA' | translate"
    (onClick)="onTriggerClick($event)"
  />
  <!-- Counts unread *conversations*, not messages: five messages in one thread
       still read as one, and the set-based source cannot drift. -->
  @if (unreadBadge()) {
    <p-badge
      severity="danger"
      [value]="unreadBadge()"
      styleClass="absolute -right-1 -top-1"
      data-testid="messenger-unread-badge"
    />
  }
</div>
<!-- Mounted here rather than in a route so a call survives navigation; renders
     nothing at all when there is no call. -->
<messenger-call-dock />
<!-- Same reasoning, and the reason the windows exist: a docked chat is worth
     having precisely while the user is somewhere other than /messenger. The
     shell mounts this remote at /messenger, so that is where its chats live. -->
<messenger-chat-dock [chatsLink]="['/messenger', 'chats']" />

<p-popover #messengerPopover [dismissable]="true" (onShow)="centrePanel()">
  <div class="flex w-80 max-w-full flex-col gap-3 text-sm">
    <p
      class="datha-text-muted datha-popover-title pb-2 text-xs font-semibold uppercase tracking-wide"
    >
      {{ "MESSENGER.WIDGET.TITLE" | translate }}
    </p>

    @if (rows().length === 0) {
      <div class="flex flex-col items-center gap-2 py-4 text-center">
        <i
          class="datha-text-muted pi pi-comments text-2xl"
          aria-hidden="true"
        ></i>
        <p class="datha-text-muted">
          {{ "MESSENGER.WIDGET.EMPTY" | translate }}
        </p>
      </div>
    } @else {
      <ul
        class="m-0 flex max-h-80 list-none flex-col gap-1 overflow-y-auto p-0"
        role="list"
      >
        @for (row of rows(); track row.id) {
          <li>
            <button
              type="button"
              class="widget-row flex w-full items-center gap-3 rounded-xl px-2 py-2 text-left"
              data-testid="widget-conversation"
              (click)="openConversation(row.id)"
            >
              <span class="widget-avatar relative shrink-0" aria-hidden="true">
                {{ row.title.charAt(0).toUpperCase() }}
                <span
                  class="presence-dot"
                  [class.is-online]="row.presence === 'online'"
                  [class.is-away]="row.presence === 'away'"
                ></span>
              </span>
              <span class="flex min-w-0 flex-1 flex-col">
                <span
                  class="truncate text-[0.8125rem]"
                  [class.font-semibold]="row.unread"
                  >{{ row.title }}</span
                >
                <span class="datha-text-muted truncate text-[0.6875rem]">{{
                  row.preview
                }}</span>
              </span>
              @if (row.unread) {
                <span class="widget-unread-dot shrink-0" aria-hidden="true"></span>
              }
            </button>
          </li>
        }
      </ul>
    }

    <div class="datha-popover-footer pt-2">
      <p-button
        [label]="'MESSENGER.WIDGET.SEE_ALL' | translate"
        icon="pi pi-arrow-right"
        iconPos="right"
        [text]="true"
        (onClick)="openMessenger()"
      />
    </div>
  </div>
</p-popover>
