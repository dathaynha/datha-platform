FILTER_REGEX_EXCLUDE: "(\\.venv/|__pycache__/|\\.pytest_cache/|\\.coverage|azure-pipelines/)"

YAML_YAMLLINT_FILTER_REGEX_EXCLUDE: "(azure-pipelines/)"

DISABLE_LINTERS:
  - SPELL_CSPELL
  # Dockerfile USER/HEALTHCHECK — track in deploy hardening, not bot-review gate (see api-gateway).
  - REPOSITORY_GRYPE
  - REPOSITORY_TRIVY
  # Test helpers repeat small setup blocks; 0% jscpd threshold is noise.
  - COPYPASTE_JSCPD
  # MegaLinter container has no pip install of service deps — import/type linters false-fail.
  - PYTHON_PYRIGHT
  - PYTHON_PYLINT
  - PYTHON_MYPY
  # pytest assert + OAuth URL string false positives (B101/B105).
  - PYTHON_BANDIT
  # E501 conflicts with Black line wraps; Black/isort are the format gate below.
  - PYTHON_FLAKE8
  # Pedantic README table padding; markdownlint warnings are enough.
  - MARKDOWN_MARKDOWN_TABLE_FORMATTER

ENABLE_LINTERS:
  - PYTHON_BLACK
  - PYTHON_ISORT

PYTHON_ISORT_CONFIG_FILE: pyproject.toml

FLAVOR_SUGGESTIONS: false
