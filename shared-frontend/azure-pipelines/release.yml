trigger:
  branches:
    exclude:
      - "*"
  tags:
    include:
      - "v*"

pr: none

pool:
  vmImage: ubuntu-24.04

steps:
  - checkout: self
    fetchDepth: 0

  - task: UseNode@1
    inputs:
      version: "24.x"
    displayName: Use Node.js 24

  - task: npmAuthenticate@0
    inputs:
      workingFile: .npmrc
    displayName: Authenticate Azure Artifacts

  - script: |
      set -euo pipefail
      corepack enable
      corepack prepare pnpm@10.33.2 --activate
      pnpm install --frozen-lockfile
    displayName: Install dependencies

  - script: pnpm version:check
    displayName: Verify tag matches package version

  - script: pnpm build
    displayName: Build Angular package

  - script: npm pack ./dist/platform-ui --dry-run
    displayName: Inspect package contents

  - script: npm publish ./dist/platform-ui
    displayName: Publish @datha/platform-ui
